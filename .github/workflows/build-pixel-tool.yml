name: Build experimental pixel tool
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-pixel-tool.yml'
permissions:
  contents: write
concurrency:
  group: pixel-tool-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: site
          persist-credentials: true
      - uses: actions/checkout@v4
        with:
          repository: Alex-Prakash/SynthIDRemover
          ref: main
          path: upstream
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: upstream/package-lock.json
      - name: Build upstream React application
        working-directory: upstream
        run: |
          npm ci
          npm run build -- --base=/ai-marks-remover/pixel-tool/
      - name: Install built site in dedicated path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/pixel-tool
          cp -R upstream/dist/. site/pixel-tool/
          touch site/.nojekyll
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pixel-tool .nojekyll
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Publish experimental client-side pixel processing app"
            # Remote main may change while npm builds; replay only our generated commit.
            # Never force-push or overwrite newer commits.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                echo "Published built assets successfully"
                exit 0
              fi
              echo "Concurrent update detected; retrying safely ($attempt/5)"
              sleep 2
            done
            echo "Failed to publish after safe retries" >&2
            exit 1
          fi
